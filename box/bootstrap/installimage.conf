## Hetzner installimage config of the agent box: Ubuntu 24.04 on software RAID1 across its two
## NVMe drives; other drives stay untouched. install-os.sh prepends the HOSTNAME line.
DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
SWRAID 1
SWRAIDLEVEL 1
BOOTLOADER grub
PART /boot ext4 1024M
PART swap swap 8G
PART / ext4 all
IMAGE /root/.oldroot/nfs/images/Ubuntu-2404-noble-amd64-base.tar.zst
